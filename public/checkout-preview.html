<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Checkout — Playroom Toys</title>
<meta name="description" content="Playroom Toys uses Stripe for all payment processing. Card details are collected directly by Stripe and never stored on Playroom servers.">
<meta name="robots" content="noindex">
<script src="https://js.stripe.com/v3/"></script>
<script src="/checkout-preview.js" defer></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#f6f8fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;font-family:system-ui,-apple-system,sans-serif;color:#1a1f36}
  .wrap{width:100%;max-width:400px}
  .header{text-align:center;margin-bottom:28px}
  .header-label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#636e72;margin-bottom:8px}
  .ssl-line{font-size:12px;color:#8a9bab;display:flex;align-items:center;justify-content:center;gap:6px}
  .card{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;border:1px solid #e1e8ed}
  .summary{padding:22px 24px 18px;border-bottom:1px solid #f0f4f7}
  .summary-label{font-size:11px;font-weight:600;color:#8792a2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
  .summary-row{display:flex;justify-content:space-between;font-size:14px}
  .summary-row+.summary-row{margin-top:6px;color:#6b7c93;font-size:13px}
  .summary-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid #f0f4f7}
  .payment{padding:22px 24px}
  .payment-label{font-size:11px;font-weight:600;color:#8792a2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
  #stripe-card-element{border:1px solid #e0e0e0;border-radius:5px;padding:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:44px}
  #stripe-card-element.StripeElement--focus{border-color:#635bff;box-shadow:0 0 0 3px rgba(99,91,255,.12)}
  #card-errors{color:#fa755a;font-size:12px;margin-top:8px;min-height:16px}
  .secure-note{margin-top:14px;padding:11px 13px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#6b7280}
  .secure-note strong{color:#635bff;font-weight:700}
  .powered{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#9ca3af}
  .back{text-align:center;margin-top:20px}
  .back a{font-size:12px;color:#636e72;text-decoration:none;border-bottom:1px solid #d0d7de;padding-bottom:1px}
  .fallback-form{border:1px solid #e0e0e0;border-radius:5px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .field-wrap{border-bottom:1px solid #e0e0e0}
  .field-wrap:last-child{border-bottom:none}
  .field-row{display:grid;grid-template-columns:1fr 1fr}
  .field-row .field-wrap:first-child{border-right:1px solid #e0e0e0}
  .field-label{padding:10px 14px 0;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#8792a2}
  .field-input{border:none;width:100%;padding:8px 14px 12px;font-size:15px;color:#aab7c4;background:transparent;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-label">Playroom Toys · Secure Checkout</div>
    <div class="ssl-line">
      <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 1L1.5 3v4c0 2.76 1.95 5.34 4.5 6 2.55-.66 4.5-3.24 4.5-6V3L6 1z" fill="#2ecc71" fill-opacity=".2" stroke="#2ecc71" stroke-width="1.2"/></svg>
      256-bit TLS · Stripe PCI DSS Level 1
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <div class="summary-label">Order summary</div>
      <div class="summary-row"><span>Rainbow Stacker × 1</span><strong>$29.00</strong></div>
      <div class="summary-row"><span>Shipping</span><span>$4.95</span></div>
      <div class="summary-total"><span>Total</span><span>$33.95</span></div>
    </div>
    <div class="payment">
      <div class="payment-label">Payment details</div>
      <div id="stripe-mount"></div>
      <div id="card-errors" role="alert"></div>
      <div class="secure-note">
        <svg width="13" height="16" viewBox="0 0 13 16" fill="none"><rect x="1" y="6" width="11" height="9" rx="2" fill="none" stroke="#635bff" stroke-width="1.3"/><path d="M4 6V4.5a2.5 2.5 0 015 0V6" stroke="#635bff" stroke-width="1.3" stroke-linecap="round"/></svg>
        Your payment info is encrypted and securely handled by <strong>Stripe</strong>
      </div>
      <div class="powered">
        <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="#635bff" fill-opacity=".15" stroke="#635bff" stroke-opacity=".4" stroke-width=".8"/><path d="M3.5 5.5l1 1 2-2" stroke="#635bff" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Powered by <strong style="color:#635bff;font-weight:700;margin-left:3px">Stripe</strong>
      </div>
    </div>
  </div>

  <div class="back"><a href="/">← Back to Playroom Toys</a></div>
</div>

</body>
</html>
